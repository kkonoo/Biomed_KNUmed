<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>의과학과 교수진 · 연구실 소개</title>
<meta name="description" content="의과학과에서는 기초의학과 임상의학 교수님들이 함께 대학원생을 지도해요. 관심 가는 연구 주제를 찾아보고, 링크를 눌러 연구실을 더 알아보세요.">
<style>/* 화면용(namebook.html). 틀은 의과대학 연구실 찾기(lab-finder-med)와 같고, 강조색은 HaLab 슬라이드 갤러리 blue */
@font-face { font-family: Pretendard; font-weight: 400; src: url(fonts/Pretendard-Regular.woff2) format("woff2"); }
@font-face { font-family: Pretendard; font-weight: 500; src: url(fonts/Pretendard-Medium.woff2) format("woff2"); }
@font-face { font-family: Pretendard; font-weight: 600; src: url(fonts/Pretendard-SemiBold.woff2) format("woff2"); }
@font-face { font-family: Pretendard; font-weight: 700; src: url(fonts/Pretendard-Bold.woff2) format("woff2"); }

:root { --text: #262B33; --sub: #6B7280; --line: #E2E5EA; --bg: #FBFBFB; --surface: #FFFFFF;
  --accent: #2563C9; --tint: #E9F0FB; --photo: #E9ECF0; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: 15px; line-height: 1.55; letter-spacing: -0.01em; word-break: keep-all; }
h1, h2, h3, p, ul, ol, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1600px; margin: 0 auto; padding: 0 32px; }
.label { color: var(--accent); font-size: 13px; font-weight: 500; }
h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.3; }
h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.35; }
.lead { color: var(--sub); font-size: 16px; }
.panel { padding: 28px 32px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }

/* 머리 줄 */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; line-height: 1.3; }
.brand .mark { width: 36px; height: 36px; object-fit: contain; }
.brand span { display: flex; flex-direction: column; }
.brand small { color: var(--sub); font-size: 12px; }
.brand b { font-size: 17px; font-weight: 700; }
.top nav { display: flex; gap: 4px; }
.top nav a { padding: 8px 12px; border-radius: 9px; color: var(--sub); font-weight: 600; white-space: nowrap; }
.top nav a.on { color: var(--accent); background: var(--tint); }
@media (hover: hover) { .top nav a:hover { color: var(--text); } }

/* 단추·칩 */
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; border: 1px solid var(--line); border-radius: 9px;
  background: var(--surface); color: var(--text); font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled, .chip:disabled { opacity: .4; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 99px;
  background: var(--surface); color: var(--text); cursor: pointer; }
.chip small { color: var(--sub); }
.chip.on { border-color: var(--accent); background: var(--tint); color: var(--accent); font-weight: 600; }
.chip.on small { color: var(--accent); }
@media (hover: hover) { .btn:not(:disabled):hover, .chip:not(:disabled):hover { border-color: var(--accent); } .btn.primary:hover { filter: brightness(1.08); } }

/* 첫머리: 제목·숫자 + QR. QR 상자는 오른쪽 끝 기둥 */
.hero { display: grid; grid-template-columns: minmax(0, max-content) 320px; justify-content: space-between; gap: 32px;
  align-items: stretch; padding: 36px 0 28px; }
.hero .lead { margin-top: 8px; max-width: 820px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 24px; }
.stats div { display: flex; align-items: baseline; gap: 8px; padding: 18px 20px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; }   /* 숫자 옆에 이름 */
.stats b { color: var(--accent); font-size: 26px; font-weight: 700; line-height: 1.2; }
.stats span { color: var(--sub); font-size: 14px; }
.qr-box { display: grid; justify-items: center; align-content: center; gap: 6px; padding: 16px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; font-size: 13px; text-align: center; }
.qr-box svg { width: 96px; height: 96px; margin-bottom: 4px; }
.qr-box .how { color: var(--sub); }
.qr-box b { color: var(--text); }
.qr-box a { color: var(--accent); }

/* 관심 분야 테스트 */
.quiz { margin-bottom: 40px; }
.quiz > * { max-width: 860px; }
.quiz .lead { margin-top: 8px; }
.bar { height: 5px; margin-bottom: 14px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.q { margin: 8px 0 18px; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
.q small { margin-left: 8px; color: var(--sub); font-size: 14px; font-weight: 400; }
.opts { display: grid; gap: 10px; }
.opt { padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text);
  font-size: 16px; text-align: left; cursor: pointer; }
.opt.on { border-color: var(--accent); background: var(--tint); }
@media (hover: hover) { .opt:hover, .recs a:hover { border-color: var(--accent); } }
.back { margin-top: 16px; padding: 0; border: 0; background: none; color: var(--sub); cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.quiz .chip { padding: 9px 14px; }
.type { display: flex; align-items: center; gap: 14px; margin: 8px 0 12px; }
.type .emoji { font-size: 42px; line-height: 1; }
.type h2 { color: var(--accent); }
.code { color: var(--sub); }
.rec-title { margin: 24px 0 10px; font-size: 17px; font-weight: 700; }
.rec-title small { margin-left: 8px; color: var(--sub); font-size: 13px; font-weight: 400; }
.recs { display: grid; gap: 8px; }
.recs a { display: flex; align-items: center; gap: 14px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; }
.recs img { flex: none; width: 44px; height: 58px; object-fit: cover; object-position: 50% 20%; border-radius: 6px; background: var(--photo); }
.recs small { color: var(--sub); }
.pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; margin-top: 16px; }
.pager span { min-width: 48px; color: var(--sub); text-align: center; }

/* 교수진 둘러보기: 찾기 · 칩 · 카드 · 쪽 넘기기 */
.book { padding-bottom: 56px; scroll-margin-top: 16px; }
.book h2 { margin-bottom: 16px; }
.search { width: 100%; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
  color: var(--text); font: inherit; font-size: 16px; }
.search:focus { outline: 2px solid var(--tint); border-color: var(--accent); }
.filters { display: grid; gap: 10px; margin: 14px 0 6px; }
.filter { display: grid; grid-template-columns: 48px 1fr; gap: 10px; align-items: start; }
.filter > span { padding-top: 6px; color: var(--sub); font-size: 14px; }
.count { margin: 14px 0 12px; color: var(--sub); }
.count b { color: var(--text); }
.cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.empty { padding: 40px 0; color: var(--sub); text-align: center; }
.card { display: grid; grid-template-columns: 76px 1fr; grid-template-rows: auto 1fr; gap: 12px 14px; padding: 18px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; scroll-margin-top: 16px; }
.card.flash { border-color: var(--accent); box-shadow: 0 0 0 2px var(--tint); }
.photo { width: 76px; height: 101px; object-fit: cover; object-position: 50% 20%; background: var(--photo); border-radius: 6px; }
.id h3 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
.name { color: var(--text); font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
.rank { font-size: 13px; font-weight: 500; }
.dept, .mail, .contact { color: var(--sub); font-size: 13px; }
.dept { margin-top: 2px; }
.mail { word-break: break-all; }
.contact { margin-top: 4px; }
.contact span { color: var(--accent); font-weight: 600; }
.about { grid-column: 1 / 3; display: flex; flex-direction: column; gap: 10px; }
.line { font-size: 15px; }
.kw { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: auto; }
.kw li { color: var(--sub); font-size: 12px; }
.kw li::before { content: "#"; margin-right: 1px; color: var(--accent); }
.go { display: flex; flex-wrap: wrap; gap: 4px 16px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--accent);
  font-size: 14px; font-weight: 600; }
.pages { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 24px; }
.pages button { min-width: 40px; height: 40px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px;
  background: var(--surface); color: var(--text); cursor: pointer; }
.pages button.on { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 600; }
.pages button:disabled { opacity: .4; cursor: default; }

/* 맨 아래 */
.foot { border-top: 1px solid var(--line); }
.foot .wrap { display: flex; justify-content: space-between; gap: 16px; padding-top: 20px; padding-bottom: 28px;
  color: var(--sub); font-size: 13px; }
.foot a { color: var(--sub); }
.foot a:hover { color: var(--text); }

@media (max-width: 1500px) { .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 1100px) {
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero { grid-template-columns: minmax(0, max-content); }
  .qr-box { padding: 12px 14px; }
  .qr-box svg, .qr-box .phone { display: none; }   /* 좁은 화면은 홈페이지 링크만 (QR은 넓은 화면에서 휴대폰으로 옮겨 볼 때 써요) */
}
@media (max-width: 700px) {
  .wrap { padding: 0 16px; }
  .top .wrap { min-height: 56px; }
  .brand span { display: none; }   /* 좁은 화면은 심볼만 (제목은 바로 아래 h1에 있어요) */
  .top nav a { padding: 6px 10px; }
  h1 { font-size: 24px; }
  h2 { font-size: 21px; }
  .hero { padding: 24px 0 20px; gap: 16px; }
  .stats { gap: 8px; }
  .stats div { display: block; padding: 12px 16px; }   /* 휴대폰은 칸이 좁아서 이름을 숫자 아래에 */
  .stats b { display: block; }
  .stats span { font-size: 13px; }
  .panel { padding: 22px 16px; border-radius: 12px; }
  .q { font-size: 19px; }
  .filter { grid-template-columns: 1fr; gap: 6px; }
  .filter > span { padding-top: 0; }
  .cards { grid-template-columns: 1fr; gap: 12px; }
}
</style></head>

<script>// 관심 분야 테스트: 9문항(둘 중 하나) + 관심 주제(두 개까지) -> 유형 + 잘 맞는 교수님
(() => {
  const D = JSON.parse(document.getElementById("data").textContent);
  const box = document.getElementById("quiz");
  const N = D.questions.length;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
  const PER = 5;  // 추천 목록 한 쪽에 5분
  let step = -1, ans = [], picks = [], opts = [], type = [], recs = [], rpage = 0;

  function intro() {
    return `<p class="label">의과학과 · 2분 테스트</p>
      <h2>나에게 맞는 연구 스타일은?</h2>
      <p class="lead">정답은 없어요. 마음이 가는 쪽을 골라 주세요. 결과에 맞는 교수님 연구실을 추천해 드려요.</p>
      <div class="row"><button class="btn primary" data-act="start">테스트 시작</button>
      <a class="btn" href="#book">교수진 바로 보기 ↓</a></div>`;
  }

  function head(i) {
    return `<div class="bar"><i style="width:${(i / (N + 1)) * 100}%"></i></div>
      <p class="label">${i + 1} / ${N + 1}</p>`;
  }

  function question() {
    const q = D.questions[step];
    return head(step) + `<h3 class="q">${esc(q.q)}</h3>
      <div class="opts">${opts[step].map(([k, t]) =>
        `<button class="opt${ans[step] === k ? " on" : ""}" data-act="pick" data-k="${k}">${esc(t)}</button>`).join("")}</div>
      <button class="back" data-act="back">← 이전</button>`;
  }

  function topics() {
    return head(N) + `<h3 class="q">가장 궁금한 주제는? <small>두 개까지</small></h3>
      <div class="chips">${D.topics.map(([k, icon, label]) => {
        const on = picks.includes(k);
        return `<button class="chip${on ? " on" : ""}" data-act="topic" data-k="${k}" aria-pressed="${on}"
          ${!on && picks.length >= 2 ? "disabled" : ""}>${icon} ${esc(label)}</button>`;
      }).join("")}</div>
      <div class="row"><button class="btn primary" data-act="done" ${picks.length ? "" : "disabled"}>결과 보기</button></div>
      <button class="back" data-act="back">← 이전</button>`;
  }

  // 유형과 추천 목록은 결과에 들어갈 때 한 번만 정한다 (넘길 때마다 섞이지 않게)
  function finish() {
    type = D.axes.map(([a, b], i) => {
      const n = ans.slice(i * 3, i * 3 + 3).filter(k => k === a[0]).length;
      return n >= 2 ? a : b;
    });
    const code = type.map(t => t[0]).join("");
    // 주제가 겹치면 3점, 스타일 글자가 같으면 1점씩(유형이 여럿이면 가장 가까운 것). 동점은 섞어서 매번 조금씩 다르게
    const scored = shuffle(D.profs).map(p => {
      const hit = p.topics.filter(t => picks.includes(t)).length;
      const same = Math.max(...[].concat(p.style).map(st => [...code].filter((c, i) => st[i] === c).length));
      return { p, s: 3 * hit + same, ok: same === 3 || (hit > 0 && same >= 2) };
    }).sort((x, y) => y.s - x.s);
    // 같은 유형 전부 + 주제가 겹치는 가까운 유형. 5분이 안 되면 다음으로 가까운 분으로 채움
    const ok = scored.filter(r => r.ok);
    recs = (ok.length >= PER ? ok : ok.concat(scored.filter(r => !r.ok).slice(0, PER - ok.length))).map(r => r.p);
    rpage = 0;
  }

  function result() {
    const [icon, name, text] = D.types[type.map(t => t[0]).join("")];
    const pages = Math.ceil(recs.length / PER);
    const shown = recs.slice(rpage * PER, rpage * PER + PER);
    return `<p class="label">나의 연구 스타일</p>
      <div class="type"><span class="emoji">${icon}</span><div><h2>${esc(name)}</h2>
        <p class="code">${type.map(t => `${t[1]} ${esc(t[2])}`).join(" · ")}</p></div></div>
      <p class="lead">${esc(text)}</p>
      <h3 class="rec-title">이런 교수님 연구실이 잘 맞을 수 있어요 <small>${recs.length}분 · 잘 맞는 순</small></h3>
      <ul class="recs">${shown.map(p => `<li><a href="#p-${esc(p.id)}" data-prof="${esc(p.id)}">
        <img src="${esc(p.photo)}" alt=""><span><b>${esc(p.name)}</b> ${esc(p.rank)}<br>
        <small>${esc(p.dept)}</small><br><small class="tags">${p.keywords.map(k => "#" + esc(k)).join(" ")}</small></span></a></li>`).join("")}</ul>
      ${pages > 1 ? `<div class="pager"><button class="btn" data-act="prev" ${rpage ? "" : "disabled"}>‹ 이전</button>
        <span>${rpage + 1} / ${pages}</span>
        <button class="btn" data-act="next" ${rpage < pages - 1 ? "" : "disabled"}>다음 ›</button></div>` : ""}
      <div class="row"><button class="btn" data-act="again">다시 하기</button>
      <a class="btn primary" href="#book">전체 교수진 보기 ↓</a></div>`;
  }

  function render(target) {
    box.innerHTML = step < 0 ? intro() : step < N ? question() : step === N ? topics() : result();
    const el = target && (box.querySelector(target) || box);
    if (el && el.getBoundingClientRect().top < 0) el.scrollIntoView();
  }

  box.addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const act = b.dataset.act;
    if (act === "start") { opts = D.questions.map(q => shuffle(q.a)); ans = []; picks = []; step = 0; }
    else if (act === "pick") { ans[step] = b.dataset.k; step++; }
    else if (act === "back") step--;
    else if (act === "topic") {
      const k = b.dataset.k;
      picks = picks.includes(k) ? picks.filter(x => x !== k) : picks.concat(k);
    }
    else if (act === "done") { finish(); step = N + 1; }
    else if (act === "again") step = -1;
    else if (act === "prev" || act === "next") { rpage += act === "next" ? 1 : -1; return render(".rec-title"); }
    render("#quiz");
  });

  render(null);
})();

// 교수진 둘러보기: 이름·교실·키워드로 찾기, 구분·교실·주제 칩으로 거르기, 한 쪽에 12분씩 쪽 넘기기
// 데이터는 build.py가 페이지 안(#data)에 넣어요. 교수님은 기초·임상 → 교실 → 이름 순
(() => {
  const D = JSON.parse(document.getElementById("data").textContent);
  const profs = D.profs;
  const PER = 12;   // 한 쪽에 12분 (네 줄·세 줄·두 줄 칸에 모두 맞아요)
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ko = (a, b) => a.localeCompare(b, "ko");
  // 찾기용 글자: 띄어쓰기·대소문자·가운뎃점 무시 ('생화학 세포' = '생화학·세포')
  const fold = s => String(s || "").toLowerCase().replace(/[\s·・,.\-_/()]+/g, "");
  const shortDept = d => d.replace(/교실$/, "");
  const topics = D.topics.filter(([k]) => profs.some(p => p.topics.includes(k)));
  const n = { 기초: profs.filter(p => p.kind === "기초").length, 임상: profs.filter(p => p.kind === "임상").length };
  const state = { q: "", kind: "", dept: "", topic: "", page: 0 };

  function matches(p) {
    const words = state.q.trim().split(/\s+/).map(fold).filter(Boolean);
    if (!words.length) return true;
    const hay = fold([p.name, p.dept, p.rank, p.line, ...p.keywords].join(" "));
    return words.every(w => hay.includes(w));
  }
  const inKind = p => !state.kind || p.kind === state.kind;
  const filtered = () => profs.filter(p => inKind(p) && (!state.dept || p.dept === state.dept)
    && (!state.topic || p.topics.includes(state.topic)) && matches(p));

  // 칩: 고른 칩을 한 번 더 누르면 전체로
  function chip(key, value, label, count) {
    const on = state[key] === value;
    return `<button class="chip${on ? " on" : ""}" type="button" data-f="${key}" data-v="${esc(value)}" aria-pressed="${on}">${label}${count == null ? "" : ` <small>${count}</small>`}</button>`;
  }
  function renderFilters() {
    const kindPs = profs.filter(inKind);
    $("#fKind").innerHTML = chip("kind", "", "전체", profs.length) + ["기초", "임상"].map(k => chip("kind", k, k, n[k])).join("");
    const depts = [...new Set(kindPs.map(p => p.dept))].sort(ko);
    $("#fDept").innerHTML = chip("dept", "", "전체") + depts.map(d => chip("dept", d, esc(shortDept(d)), kindPs.filter(p => p.dept === d).length)).join("");
    $("#fTopic").innerHTML = chip("topic", "", "전체") + topics.map(([k, icon, label]) =>
      chip("topic", k, `${icon} ${esc(label)}`, kindPs.filter(p => p.topics.includes(k)).length)).join("");
  }

  function card(p) {
    const kws = p.keywords.map(k => `<li>${esc(k)}</li>`).join("");
    const links = p.links.map(([url, label]) => `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(label)} →</a>`).join("");
    // 담당자가 교수님 본인이고 연락처가 이메일과 같으면 한 번만
    const c = p.contact && !(p.contact[0] === p.name && p.contact[1] === p.email) ? p.contact : null;
    return `<article class="card" id="p-${esc(p.id)}">
      <img class="photo" src="${esc(p.photo)}" alt="" loading="lazy">
      <div class="id">
        <h3><span class="name">${esc(p.name)}</span><span class="rank">${esc(p.rank)}</span></h3>
        <p class="dept">${esc(p.dept)}</p>
        <p class="mail"><a href="mailto:${esc(p.email)}">${esc(p.email)}</a></p>
        ${c ? `<p class="contact"><span>담당자</span> ${esc(c[0])}${c[1] ? `<br>${esc(c[1])}` : ""}</p>` : ""}
      </div>
      <div class="about">
        <p class="line">${esc(p.line)}</p>
        <ul class="kw">${kws}</ul>
        ${links ? `<p class="go">${links}</p>` : ""}
      </div>
    </article>`;
  }

  function render() {
    const list = filtered();
    const last = Math.max(1, Math.ceil(list.length / PER));
    state.page = Math.min(state.page, last - 1);
    const filtering = state.q.trim() || state.kind || state.dept || state.topic;
    $("#count").innerHTML = filtering ? `<b>${list.length}명</b> / ${profs.length}명` : `<b>${profs.length}명</b>`;
    $("#cards").innerHTML = list.length ? list.slice(state.page * PER, state.page * PER + PER).map(card).join("")
      : '<p class="empty">맞는 교수님이 없어요. 찾는 말이나 칩을 바꿔 보세요.</p>';
    $("#cards").classList.toggle("cards", list.length > 0);
    const cur = state.page + 1;
    $("#pages").innerHTML = last < 2 ? "" : `<button type="button" data-page="${cur - 1}" ${cur > 1 ? "" : "disabled"} aria-label="이전 쪽">‹</button>`
      + Array.from({ length: last }, (_, i) => i + 1).map(x =>
        `<button type="button" data-page="${x}"${x === cur ? ' class="on" aria-current="page"' : ""}>${x}</button>`).join("")
      + `<button type="button" data-page="${cur + 1}" ${cur < last ? "" : "disabled"} aria-label="다음 쪽">›</button>`;
  }

  const top = () => { if ($("#book").getBoundingClientRect().top < 0) $("#book").scrollIntoView(); };

  $(".filters").addEventListener("click", e => {
    const b = e.target.closest("[data-f]");
    if (!b) return;
    const { f, v } = b.dataset;
    state[f] = state[f] === v ? "" : v;
    // 구분을 바꾸면 그 구분에 없는 교실은 풀어요
    if (f === "kind" && state.dept && !profs.some(p => inKind(p) && p.dept === state.dept)) state.dept = "";
    state.page = 0;
    renderFilters();
    render();
  });
  $("#q").addEventListener("input", e => {
    state.q = e.target.value;
    state.page = 0;
    render();
  });
  $("#pages").addEventListener("click", e => {
    const b = e.target.closest("[data-page]");
    if (!b || b.disabled) return;
    state.page = Number(b.dataset.page) - 1;
    render();
    top();
  });

  // 테스트 추천에서 교수님을 누르면: 거르기를 풀고 그분이 있는 쪽을 열어 카드를 보여 줘요
  document.addEventListener("click", e => {
    const a = e.target.closest("a[data-prof]");
    if (!a) return;
    e.preventDefault();
    Object.assign(state, { q: "", kind: "", dept: "", topic: "" });
    $("#q").value = "";
    state.page = Math.floor(profs.findIndex(p => p.id === a.dataset.prof) / PER);
    renderFilters();
    render();
    const el = document.getElementById(`p-${a.dataset.prof}`);
    if (!el) return;
    el.scrollIntoView({ block: "center" });
    el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 1600);
  });

  renderFilters();
  render();
})();
</script>
</body></html>
